<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#2a1838">
		<title>Glade (3D prototype)</title>
		<style>
/* The Glade's web page: Godot's default shell, with a twinkly loading screen (#status) that
   stays up until the game's first frame is drawn (main.gd calls window.gladeReady()), never a
   blank page. Its animations move only opacity and transform, which the browser runs off the
   main thread, so they keep twinkling while the game is busy starting. */
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #2a1838;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background: radial-gradient(ellipse at 50% 45%, #6b4b9e 0%, #4a2f72 38%, #2a1838 100%);
	transition: opacity 0.5s ease-out;
	z-index: 1;
	overflow: hidden;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

/* Twinkles: four-pointed stars dotted about, each fading and growing on its own beat. */
.twinkle {
	position: absolute;
	width: var(--s);
	height: var(--s);
	background: var(--c);
	clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
	opacity: 0;
	animation: twinkle var(--d) ease-in-out var(--w) infinite;
	will-change: opacity, transform;
}

@keyframes twinkle {
	0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
	50% { opacity: 1; transform: scale(1) rotate(45deg); }
}

/* Sparkles drifting up past the gem. */
.mote {
	position: absolute;
	bottom: -10px;
	width: var(--s);
	height: var(--s);
	border-radius: 50%;
	background: var(--c);
	box-shadow: 0 0 6px 2px var(--c);
	opacity: 0;
	animation: rise var(--d) linear var(--w) infinite;
	will-change: opacity, transform;
}

@keyframes rise {
	0% { opacity: 0; transform: translate(0, 0); }
	15% { opacity: 0.9; }
	85% { opacity: 0.7; }
	100% { opacity: 0; transform: translate(var(--x), -105vh); }
}

/* The heart gem in the middle, glowing softly. */
#gem {
	position: relative;
	width: 78px;
	height: 66px;
	animation: bob 2.4s ease-in-out infinite;
	will-change: transform;
}

#gem svg {
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
}

#glow {
	position: absolute;
	inset: -40px;
	border-radius: 50%;
	background: radial-gradient(circle, rgba(255, 170, 220, 0.55) 0%, rgba(200, 144, 255, 0.25) 40%, rgba(200, 144, 255, 0) 70%);
	animation: glow 2.4s ease-in-out infinite;
	will-change: opacity, transform;
}

@keyframes bob {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-8px); }
}

@keyframes glow {
	0%, 100% { opacity: 0.6; transform: scale(0.9); }
	50% { opacity: 1; transform: scale(1.1); }
}

/* Downloading: a little row of gems lights up (transform only). */
#bar {
	margin-top: 36px;
	width: min(220px, 50vw);
	height: 6px;
	border-radius: 3px;
	background: rgba(255, 255, 255, 0.15);
	overflow: hidden;
}

#bar-fill {
	width: 100%;
	height: 100%;
	background: linear-gradient(90deg, #ff9ed2, #c890ff, #9fe6ff);
	transform-origin: left;
	transform: scaleX(0.04);
	transition: transform 0.25s ease-out;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: system-ui, sans-serif;
	line-height: 1.3;
	margin: 2rem;
	padding: 1rem;
	text-align: center;
}

@media (prefers-reduced-motion: reduce) {
	.twinkle, .mote, #gem, #glow { animation-duration: 6s; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	<script>
if ('serviceWorker' in navigator) {
	const hadController = !!navigator.serviceWorker.controller;
	let reloading = false;
	navigator.serviceWorker.addEventListener('controllerchange', () => {
		if (hadController && !reloading) {
			reloading = true;
			window.location.reload();
		}
	});
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible') {
			navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
		}
	});
}
</script>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="gem">
				<div id="glow"></div>
				<svg id="heart" viewBox="0 0 13 11" shape-rendering="crispEdges" aria-hidden="true"></svg>
			</div>
			<div id="bar"><div id="bar-fill"></div></div>
			<div id="status-notice"></div>
		</div>

		<script>
// Twinkles and motes, scattered fresh each visit (before the engine starts, so they're up at once).
(function () {
	const status = document.getElementById('status');
	const colors = ['#ffffff', '#ffe6f6', '#ff9ed2', '#c890ff', '#9fe6ff', '#fff1a8'];
	const pick = (a) => a[Math.floor(Math.random() * a.length)];
	// The heart gem, pixel by pixel (O ink, P pink, L light, W shine).
	const heart = [
		'..OOO...OOO..',
		'.OPPPO.OPPPO.',
		'OPWLPPOPPPPPO',
		'OPLPPPPPPPPPO',
		'OPPPPPPPPPPPO',
		'.OPPPPPPPPPO.',
		'..OPPPPPPPO..',
		'...OPPPPPO...',
		'....OPPPO....',
		'.....OPO.....',
		'......O......',
	];
	const ink = { O: '#8a2a5e', P: '#ff5fae', L: '#ff9ed2', W: '#ffffff' };
	let rects = '';
	heart.forEach((row, y) => [...row].forEach((c, x) => {
		if (ink[c]) {
			rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${ink[c]}"/>`;
		}
	}));
	document.getElementById('heart').innerHTML = rects;
	for (let i = 0; i < 46; i++) {
		const t = document.createElement('div');
		t.className = 'twinkle';
		const s = 6 + Math.random() * 16;
		t.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;--s:${s}px;--c:${pick(colors)};` +
			`--d:${1.6 + Math.random() * 2.4}s;--w:${-Math.random() * 4}s`;
		status.appendChild(t);
	}
	for (let i = 0; i < 22; i++) {
		const m = document.createElement('div');
		m.className = 'mote';
		m.style.cssText = `left:${Math.random() * 100}%;--s:${2 + Math.random() * 3}px;--c:${pick(colors)};` +
			`--d:${5 + Math.random() * 6}s;--w:${-Math.random() * 10}s;--x:${(Math.random() - 0.5) * 120}px`;
		status.appendChild(m);
	}
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":872732,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
// For measuring: ?arg=--tour=X,Z;... hops her round those spots, ?arg=--walk=X,Z;... walks her, ?arg=--hitches=1 logs slow frames, ?arg=--no_warm_up=1 skips the start's shader warm-up (main.gd), ?arg=--world=NAME plays a test world (only in an export of it: GLADE_WORLD=NAME); nothing else is passed on.
const tour = new URLSearchParams(location.search).getAll('arg').filter((a) => a.startsWith('--tour=') || a.startsWith('--walk=') || a.startsWith('--hitches=') || a.startsWith('--no_warm_up=') || a.startsWith('--world='));
if (tour.length) {
	GODOT_CONFIG.args = (GODOT_CONFIG.args || []).concat(['--'], tour);
}
// With ?arg=--hitches=1, also every shader program the GPU links (a shader's first draw: slow
// the first time, in Chrome on a Mac until Metal's cache holds it), each second there were any.
if (tour.some((a) => a.startsWith('--hitches='))) {
	const link = WebGL2RenderingContext.prototype.linkProgram;
	let n = 0, ms = 0, worst = 0;
	WebGL2RenderingContext.prototype.linkProgram = function (p) {
		const t = performance.now();
		link.call(this, p);
		this.getProgramParameter(p, this.LINK_STATUS);  // (waits for the link, so it's timed here)
		const d = performance.now() - t;
		n += 1; ms += d; worst = Math.max(worst, d);
		if (location.search.includes('shader_defs')) {  // (which variant: its #defines)
			const src = this.getAttachedShaders(p).map((sh) => this.getShaderSource(sh)).join('\n');
			const defs = [...new Set(src.split('\n').filter((l) => l.startsWith('#define ')).map((l) => l.slice(8).split(' ')[0]))];
			console.log(`Glade shader: ${d.toFixed(0)} ms, ${src.length} chars: ${defs.join(' ')}`);
		}
	};
	setInterval(() => {
		if (n) {
			console.log(`Glade shaders: ${n} linked in ${ms.toFixed(0)} ms (slowest ${worst.toFixed(0)} ms)`);
			n = 0; ms = 0; worst = 0;
		}
	}, 1000);
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const barFill = document.getElementById('bar-fill');
	const statusNotice = document.getElementById('status-notice');
	let shown = true;

	// The game calls this once its first frame is drawn (main.gd): the loading screen fades away.
	window.gladeReady = function () {
		if (!shown) {
			return;
		}
		shown = false;
		console.log(`Glade page: first frame at ${Math.round(performance.now())} ms after the page opened`);
		status.classList.add('done');
		setTimeout(() => status.remove(), 600);
	};

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		document.getElementById('bar').style.display = 'none';
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					barFill.style.transform = `scaleX(${Math.max(0.04, current / total)})`;
				}
			},
		}).then(() => {
			barFill.style.transform = 'scaleX(1)';
			// (In case the game never says it's ready: never leave the loading screen up for good.)
			setTimeout(window.gladeReady, 30000);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
